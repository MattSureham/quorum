name: Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build unsigned Windows NSIS installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Bun sidecar
        run: pnpm sidecar:bun:build

      - name: Build Web UI
        run: pnpm --filter @quorum/client-web build

      - name: Build unsigned NSIS installer
        run: pnpm --filter @quorum/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: quorum-windows-nsis-installer
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows bundle directory
        uses: actions/upload-artifact@v4
        with:
          name: quorum-windows-bundle-output
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error

      - name: Upload sidecar executable
        uses: actions/upload-artifact@v4
        with:
          name: quorum-windows-sidecar
          path: dist-sidecar/bun/quorum-sidecar.exe
          if-no-files-found: error
