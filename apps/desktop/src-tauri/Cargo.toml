[package]
name = "quorum-desktop"
version = "0.0.1"
description = "Quorum desktop shell"
authors = ["Quorum"]
edition = "2021"

[lib]
name = "quorum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
